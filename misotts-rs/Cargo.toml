[package]
name = "misotts-rs"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "misotts"
path = "src/main.rs"

[lib]
name = "misotts"
path = "src/lib.rs"

[dependencies]
candle-core = { version = "0.9", features = [] }
candle-nn = "0.9"
hf-hub = { version = "0.3", features = ["tokio"] }
tokenizers = { version = "0.20", default-features = false, features = ["onig"] }
safetensors = "0.4"
anyhow = { version = "1", features = ["backtrace"] }
thiserror = "2"
clap = { version = "4", features = ["derive"] }
hound = "3.5"
rubato = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
half = { version = "2", features = ["num-traits"] }
rand = "0.8"

# Mimi neural audio codec (encoder/decoder for the 32-codebook RVQ).
# The kyutai-labs/moshi repo ships a first-party Rust implementation;
# the package name inside the workspace is "moshi".
moshi = { git = "https://github.com/kyutai-labs/moshi", package = "moshi" }

[features]
default = []
cuda   = ["candle-core/cuda",  "candle-nn/cuda",  "moshi/cuda"]
metal  = ["candle-core/metal", "candle-nn/metal", "moshi/metal"]
